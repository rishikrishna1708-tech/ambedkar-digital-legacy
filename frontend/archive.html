<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ambedkar Digital Legacy | Archive</title>
  <meta name="description" content="Ambedkar Digital Legacy: Searchable Institutional Archival Catalogue for Dr. B. R. Ambedkar's historical records.">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="stylesheet" href="/css/heritage-bg.css">
</head>
<body class="bg-[#F8F4E8] text-[#232832] flex flex-col min-h-screen">

  <div id="global-header"></div>

  <!-- Sub-header with Ambient Heritage Background -->
  <div class="relative bg-[#0D1527] text-white py-4 border-b border-[#D7A940]/40 overflow-hidden">
    <!-- Ambient 24-Spoke Chakra & Subtle Particles -->
    <div class="ashoka-chakra hero-chakra parallax-layer" style="right: -80px; width: 440px; height: 440px; opacity: 0.045;" aria-hidden="true">
      <img src="/assets/ashoka_chakra_24.svg" alt="" class="w-full h-full">
    </div>
    <div class="archive-particles" style="opacity: 0.45;" aria-hidden="true"></div>

    <div class="global-container relative z-10 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2">
      <div>
        <h1 class="font-heading-cinzel text-xl sm:text-2xl font-bold text-white tracking-wide" data-i18n="archive_title">Archival Catalogue</h1>
        <p class="text-xs text-gray-300 font-light mt-0.5" data-i18n="archive_subtitle">
          Browse authenticated primary collections, manuscripts, and constitutional records with complete provenance.
        </p>
      </div>
      <div class="flex items-center space-x-2">
        <span id="results-count-badge" class="badge-gold text-xs px-2.5 py-1 rounded font-bold">Loading records...</span>
      </div>
    </div>
  </div>

  <main class="flex-1 global-container py-8 space-y-6">
    
    <!-- Multi-faceted Filter Bar: Search, Collection, Document Type, Year, Language, Topic -->
    <div class="archival-card p-5 rounded-lg space-y-4">
      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-7 gap-2.5">
        
        <!-- Search Input (2 cols) -->
        <div class="sm:col-span-2 lg:col-span-1">
          <label class="block text-[11px] font-bold text-gray-700 uppercase mb-1" data-i18n="search_placeholder">Search</label>
          <div class="relative">
            <input 
              type="text" 
              id="search-input" 
              placeholder="Title or keywords..." 
              data-i18n-placeholder="search_placeholder"
              class="w-full pl-8 pr-3 py-2 text-xs border border-gray-300 rounded focus:ring-1 focus:ring-[#D7A940] focus:outline-none"
            >
            <svg class="w-4 h-4 text-gray-400 absolute left-2.5 top-2.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
          </div>
        </div>

        <!-- Collection Filter -->
        <div>
          <label class="block text-[11px] font-bold text-gray-700 uppercase mb-1" data-i18n="filter_collection">Collection</label>
          <select id="collection-filter" class="w-full py-2 px-2 text-xs border border-gray-300 rounded focus:ring-1 focus:ring-[#D7A940] focus:outline-none bg-white">
            <option value="All" data-i18n="opt_all_collections">All Collections</option>
            <option value="Writings and Speeches">Writings & Speeches</option>
            <option value="Constituent Assembly Debates Archive">CAD Archive</option>
            <option value="Historical Records & Manuscripts">Historical Manuscripts</option>
            <option value="Archival Ingestions">Archival Ingestions</option>
          </select>
        </div>

        <!-- Document Type Filter -->
        <div>
          <label class="block text-[11px] font-bold text-gray-700 uppercase mb-1" data-i18n="filter_doc_type">Document Type</label>
          <select id="type-filter" class="w-full py-2 px-2 text-xs border border-gray-300 rounded focus:ring-1 focus:ring-[#D7A940] focus:outline-none bg-white">
            <option value="All" data-i18n="opt_all_types">All Types</option>
            <option value="Book">Book</option>
            <option value="Speech">Speech</option>
            <option value="Constitutional Debate">Constitutional Debate</option>
            <option value="Manuscript">Manuscript</option>
            <option value="Photograph">Photograph</option>
            <option value="Audio">Audio</option>
            <option value="Video">Video</option>
          </select>
        </div>

        <!-- Year Filter -->
        <div>
          <label class="block text-[11px] font-bold text-gray-700 uppercase mb-1" data-i18n="filter_year">Year Period</label>
          <select id="year-filter" class="w-full py-2 px-2 text-xs border border-gray-300 rounded focus:ring-1 focus:ring-[#D7A940] focus:outline-none bg-white">
            <option value="All" data-i18n="opt_all_years">All Years</option>
            <option value="1916-1929">Early Life & Mahad (1916–1929)</option>
            <option value="1930-1939">Round Table & Movement (1930–1939)</option>
            <option value="1940-1946">Labour Ministry (1940–1946)</option>
            <option value="1947-1950">Constituent Assembly (1947–1950)</option>
            <option value="1951-1956">Post-Constitution & Legacy</option>
          </select>
        </div>

        <!-- Language Filter -->
        <div>
          <label class="block text-[11px] font-bold text-gray-700 uppercase mb-1" data-i18n="filter_language">Language</label>
          <select id="language-filter" class="w-full py-2 px-2 text-xs border border-gray-300 rounded focus:ring-1 focus:ring-[#D7A940] focus:outline-none bg-white">
            <option value="All" data-i18n="opt_all_languages">All Languages</option>
            <option value="en">English</option>
            <option value="mr">Marathi</option>
            <option value="hi">Hindi</option>
            <option value="kn">Kannada</option>
            <option value="ta">Tamil</option>
          </select>
        </div>

        <!-- Verification Status Filter -->
        <div>
          <label class="block text-[11px] font-bold text-gray-700 uppercase mb-1">Verification</label>
          <select id="verification-filter" class="w-full py-2 px-2 text-xs border border-gray-300 rounded focus:ring-1 focus:ring-[#D7A940] focus:outline-none bg-white font-medium text-emerald-800">
            <option value="All">All Statuses</option>
            <option value="VERIFIED SOURCE">Verified Source</option>
            <option value="DEMO DATA">Demo Data</option>
            <option value="UNVERIFIED (NEW INGESTION)">Unverified (New)</option>
          </select>
        </div>

        <!-- Provenance Filter -->
        <div>
          <label class="block text-[11px] font-bold text-gray-700 uppercase mb-1">Provenance</label>
          <select id="provenance-filter" class="w-full py-2 px-2 text-xs border border-gray-300 rounded focus:ring-1 focus:ring-[#D7A940] focus:outline-none bg-white font-medium text-[#8C5B08]">
            <option value="All">All Provenance</option>
            <option value="REAL ARCHIVAL DATA">Real Archival Data</option>
            <option value="USER-UPLOADED DATA">User-Uploaded Data</option>
            <option value="DEMO DATA">Demo Data</option>
          </select>
        </div>

      </div>

      <!-- Action Buttons Row -->
      <div class="flex items-center justify-between pt-2 border-t border-gray-100">
        <div class="text-[11px] text-gray-500">
          Filter records by archival genre, historical era, or search query.
        </div>
        <div class="flex items-center space-x-2">
          <button id="reset-filter-btn" class="py-1.5 px-3 bg-gray-100 text-gray-700 font-semibold text-xs rounded hover:bg-gray-200 transition-colors" data-i18n="btn_clear_filters">
            Reset Filters
          </button>
          <button id="apply-filter-btn" class="py-1.5 px-4 bg-[#141F39] text-[#D7A940] font-bold text-xs rounded hover:bg-[#202E4E] transition-colors border border-[#D7A940]">
            Apply Filters
          </button>
        </div>
      </div>
    </div>

    <!-- Archival Document Cards Grid -->
    <div id="archive-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
      <!-- Loaded dynamically via archive.js -->
    </div>

    <!-- Pagination Container -->
    <div id="pagination-container" class="flex justify-between items-center pt-4 border-t border-gray-200 text-xs">
      <!-- Injected via archive.js -->
    </div>

  </main>

  <!-- Persistent Global Footer -->
  <div id="global-footer"></div>

  <!-- Scripts -->
  <script src="/js/i18n.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/archive.js"></script>
  <script src="/js/heritage-bg.js"></script>
</body>
</html>
