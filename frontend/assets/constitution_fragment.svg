<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="600" height="800">
  <defs>
    <filter id="parchment-blur">
      <feGaussianBlur stdDeviation="0.4"/>
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="none"/>
  <!-- Archival manuscript border -->
  <rect x="25" y="25" width="550" height="750" fill="none" stroke="#D7A940" stroke-width="1.5" stroke-dasharray="12 4" opacity="0.4"/>
  <rect x="35" y="35" width="530" height="730" fill="none" stroke="#D7A940" stroke-width="0.75" opacity="0.3"/>
  
  <!-- Subtle ornate corner motifs -->
  <g stroke="#D7A940" stroke-width="1" fill="none" opacity="0.5">
    <path d="M 25 55 A 30 30 0 0 1 55 25"/>
    <path d="M 575 55 A 30 30 0 0 0 545 25"/>
    <path d="M 25 745 A 30 30 0 0 0 55 775"/>
    <path d="M 575 745 A 30 30 0 0 1 545 775"/>
  </g>
  
  <!-- Archival heading and script lines representing historical manuscript text -->
  <g fill="#D7A940" font-family="'Cinzel', Georgia, serif" opacity="0.6">
    <text x="300" y="90" font-size="16" font-weight="bold" text-anchor="middle" letter-spacing="4">CONSTITUTION OF INDIA</text>
    <text x="300" y="115" font-size="11" text-anchor="middle" letter-spacing="2">DRAFTING COMMITTEE • 1948</text>
    <line x1="180" y1="125" x2="420" y2="125" stroke="#D7A940" stroke-width="1"/>
  </g>
  
  <!-- Simulated calligraphic lines (representing historical draft pages) -->
  <g stroke="#D7A940" stroke-linecap="round" opacity="0.35">
    <line x1="60" y1="160" x2="540" y2="160" stroke-width="2.5"/>
    <line x1="60" y1="185" x2="500" y2="185" stroke-width="2"/>
    <line x1="60" y1="210" x2="530" y2="210" stroke-width="2"/>
    <line x1="60" y1="235" x2="480" y2="235" stroke-width="2"/>
    <line x1="60" y1="260" x2="520" y2="260" stroke-width="2"/>
    <line x1="60" y1="285" x2="450" y2="285" stroke-width="2.5"/>
    
    <line x1="60" y1="330" x2="540" y2="330" stroke-width="2"/>
    <line x1="60" y1="355" x2="510" y2="355" stroke-width="2"/>
    <line x1="60" y1="380" x2="535" y2="380" stroke-width="2"/>
    <line x1="60" y1="405" x2="470" y2="405" stroke-width="2"/>
    
    <line x1="60" y1="450" x2="540" y2="450" stroke-width="2"/>
    <line x1="60" y1="475" x2="520" y2="475" stroke-width="2"/>
    <line x1="60" y1="500" x2="490" y2="500" stroke-width="2"/>
    <line x1="60" y1="525" x2="540" y2="525" stroke-width="2"/>
    <line x1="60" y1="550" x2="430" y2="550" stroke-width="2"/>
    
    <line x1="60" y1="595" x2="540" y2="595" stroke-width="2"/>
    <line x1="60" y1="620" x2="515" y2="620" stroke-width="2"/>
    <line x1="60" y1="645" x2="480" y2="645" stroke-width="2"/>
    <line x1="60" y1="670" x2="530" y2="670" stroke-width="2"/>
    
    <!-- Archival stamp outline at bottom -->
    <rect x="360" y="700" width="180" height="50" fill="none" stroke="#D7A940" stroke-width="1.2" stroke-dasharray="4 2" rx="4"/>
    <text x="450" y="722" font-family="'Inter', sans-serif" font-size="8" fill="#D7A940" font-weight="bold" text-anchor="middle" letter-spacing="1">NATIONAL ARCHIVES</text>
    <text x="450" y="736" font-family="'Inter', sans-serif" font-size="7" fill="#D7A940" text-anchor="middle">VERIFIED RECORD</text>
  </g>
</svg>