<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ambedkar Digital Legacy | Timeline</title>
  <meta name="description" content="Ambedkar Digital Legacy: Interactive chronological timeline of Dr. B. R. Ambedkar's life, constitutional drafting, and social movements.">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="stylesheet" href="/css/heritage-bg.css">
</head>
<body class="bg-[#F8F4E8] text-[#232832] flex flex-col min-h-screen">

  <div id="global-header"></div>

  <!-- Sub-header with Ambient Heritage Background -->
  <div class="relative bg-[#0D1527] text-white py-4 border-b border-[#D7A940]/40 overflow-hidden">
    <!-- Ambient 24-Spoke Chakra & Subtle Particles -->
    <div class="ashoka-chakra hero-chakra parallax-layer" style="right: -80px; width: 440px; height: 440px; opacity: 0.045;" aria-hidden="true">
      <img src="/assets/ashoka_chakra_24.svg" alt="" class="w-full h-full">
    </div>
    <div class="archive-particles" style="opacity: 0.45;" aria-hidden="true"></div>

    <div class="global-container relative z-10 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2">
      <div>
        <div class="flex items-center space-x-2">
          <h1 class="font-heading-cinzel text-xl sm:text-2xl font-bold text-white tracking-wide" data-i18n="timeline_title">Historical Chronology (1891–1956)</h1>
          <span class="badge-gold text-[10px] px-2 py-0.5 rounded font-bold uppercase">1891–1956</span>
        </div>
        <p class="text-xs text-gray-300 font-light mt-0.5" data-i18n="timeline_subtitle">
          Chronological milestone explorer anchored to authenticated primary documents and speeches.
        </p>
      </div>

      <!-- Category Filter Pills -->
      <div id="timeline-filters" class="flex flex-wrap gap-1">
        <button onclick="filterTimeline('All')" class="tl-filter-btn px-2.5 py-1 rounded text-xs font-semibold bg-[#D7A940] text-[#141F39]" data-cat="All">All</button>
        <button onclick="filterTimeline('Constitution')" class="tl-filter-btn px-2.5 py-1 rounded text-xs font-medium text-gray-300 hover:text-white bg-gray-800" data-cat="Constitution">Constitution</button>
        <button onclick="filterTimeline('Social movements')" class="tl-filter-btn px-2.5 py-1 rounded text-xs font-medium text-gray-300 hover:text-white bg-gray-800" data-cat="Social movements">Social Movements</button>
        <button onclick="filterTimeline('Economics')" class="tl-filter-btn px-2.5 py-1 rounded text-xs font-medium text-gray-300 hover:text-white bg-gray-800" data-cat="Economics">Labour / Economics</button>
        <button onclick="filterTimeline('Education')" class="tl-filter-btn px-2.5 py-1 rounded text-xs font-medium text-gray-300 hover:text-white bg-gray-800" data-cat="Education">Education</button>
        <button onclick="filterTimeline('Life')" class="tl-filter-btn px-2.5 py-1 rounded text-xs font-medium text-gray-300 hover:text-white bg-gray-800" data-cat="Life">Life & Legacy</button>
      </div>
    </div>
  </div>

  <main class="flex-1 global-container max-w-5xl py-10">
    
    <!-- Timeline Vertical Track -->
    <div class="relative border-l-2 border-[#D7A940] ml-4 md:ml-32 space-y-10" id="timeline-container">
      <div class="py-12 text-center text-xs text-gray-500">Loading timeline events...</div>
    </div>

  </main>

  <div id="global-footer"></div>

  <script src="/js/i18n.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/timeline.js"></script>
  <script src="/js/heritage-bg.js"></script>
</body>
</html>
