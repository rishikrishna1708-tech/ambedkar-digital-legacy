<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ambedkar Digital Legacy | Stories</title>
  <meta name="description" content="Ambedkar Digital Legacy: Narrative archival journeys anchored to verified primary evidence citations.">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="stylesheet" href="/css/heritage-bg.css">
</head>
<body class="bg-[#F8F4E8] text-[#232832] flex flex-col min-h-screen">

  <div id="global-header"></div>

  <!-- Sub-header with Ambient Heritage Background -->
  <div class="relative bg-[#0D1527] text-white py-4 border-b border-[#D7A940]/40 overflow-hidden">
    <!-- Ambient 24-Spoke Chakra & Subtle Particles -->
    <div class="ashoka-chakra hero-chakra parallax-layer" style="right: -80px; width: 440px; height: 440px; opacity: 0.045;" aria-hidden="true">
      <img src="/assets/ashoka_chakra_24.svg" alt="" class="w-full h-full">
    </div>
    <div class="archive-particles" style="opacity: 0.45;" aria-hidden="true"></div>

    <div class="global-container relative z-10 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2">
      <div>
        <div class="flex items-center space-x-2">
          <h1 class="font-heading-cinzel text-xl sm:text-2xl font-bold text-white tracking-wide" data-i18n="stories_title">Digital Heritage Stories</h1>
          <span class="badge-gold text-[10px] px-2 py-0.5 rounded font-bold uppercase">Evidence Grounded Narratives</span>
        </div>
        <p class="text-xs text-gray-300 font-light mt-0.5" data-i18n="stories_subtitle">
          Curated historical narratives anchored directly to primary documents, speeches, and manuscripts.
        </p>
      </div>
    </div>
  </div>

  <main class="flex-1 global-container py-8 space-y-8">
    
    <!-- Story List Cards -->
    <div id="stories-grid" class="grid grid-cols-1 md:grid-cols-3 gap-6">
      <!-- Loaded dynamically via stories.js -->
    </div>

    <!-- Active Story Reader Section -->
    <div id="story-reader" class="archival-card p-8 rounded-lg bg-white border border-[#D7A940] shadow-lg hidden space-y-6">
      <!-- Active story chapters rendered dynamically -->
    </div>

  </main>

  <div id="global-footer"></div>

  <script src="/js/i18n.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/stories.js"></script>
  <script src="/js/heritage-bg.js"></script>
</body>
</html>
